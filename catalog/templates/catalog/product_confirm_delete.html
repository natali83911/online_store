{% extends 'catalog/base.html' %}

{% block content %}
<h1>Подтверждение удаления продукта</h1>
<p>Вы уверены, что хотите удалить продукт <strong>{{ object.name }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Удалить</button>
    <a href="{% url 'catalog:products_list' %}">Отмена</a>
</form>
{% endblock %}
