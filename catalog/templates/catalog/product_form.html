{% extends 'catalog/base.html' %}

{% block header_buttons %}
{% endblock %}

{% block content %}
<h1>{% if form.instance.pk %}Редактировать продукт{% else %}Добавить продукт{% endif %}</h1>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Сохранить</button>
    <a href="{% url 'catalog:products_list' %}">Отмена</a>
</form>
{% endblock %}
